name: ci

on:
  pull_request:
  push:
    branches:
      - master
  # Nightly: the live tests catch upstream API changes (these servers wrap
  # undocumented APIs) before an agent does.
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nix-dev-shell
      - run: nix develop -c make lint

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nix-dev-shell
      - run: nix develop -c make test

  images:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nix-dev-shell
      - run: nix develop -c make images

  live:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/nix-dev-shell
      - run: nix develop -c make test-live

  # The one required check: passes when every job above passed or was
  # skipped.
  checks:
    if: always()
    needs:
      - lint
      - test
      - images
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "a required job ended with: $r"; exit 1 ;;
            esac
          done
